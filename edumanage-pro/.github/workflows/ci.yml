name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edumanage_test
          POSTGRES_USER: edumanage
          POSTGRES_PASSWORD: edumanage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edumanage"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/edumanage_test
          DB_USER: edumanage
          DB_PASSWORD: edumanage
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          BOOTSTRAP_ENABLED: "false"
        run: mvn -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: edumanage-pro-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# Render Blueprint — provisions the Postgres DB and the Spring Boot API together.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: edumanage-db
    plan: free
    databaseName: edumanage
    user: edumanage

services:
  - type: web
    name: edumanage-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: edumanage-pro/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # --- Database (wired automatically from the managed Postgres above) ---
      - key: DB_HOST
        fromDatabase: { name: edumanage-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: edumanage-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: edumanage-db, property: database }
      - key: DB_USER
        fromDatabase: { name: edumanage-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: edumanage-db, property: password }
      # --- Auth secret (generated once by Render, then kept) ---
      - key: JWT_SECRET
        generateValue: true
      # --- Seed a demo tenant on first boot (set to false once you have real data) ---
      - key: BOOTSTRAP_ENABLED
        value: "true"
      # --- Set these in the Render dashboard after the frontend is deployed ---
      - key: CORS_ORIGINS
        sync: false            # e.g. https://edumanage-pro.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false            # sk_test_... (or live key in production)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false            # whsec_... from the Stripe Dashboard webhook endpoint
      - key: STRIPE_SUCCESS_URL
        sync: false            # https://<frontend>/billing/success
      - key: STRIPE_CANCEL_URL
        sync: false            # https://<frontend>/billing/cancel
